name: 治理审核

# 治理审核工作流：对目标仓库执行溯源扫描、安全检查、Lore 决策提取，并聚合生成治理报告
on:
  workflow_dispatch:
    inputs:
      repo_owner:
        description: 仓库 owner
        required: true
        type: string
      repo_name:
        description: 仓库名
        required: true
        type: string
      task_id:
        description: 任务ID
        required: true
        type: string
      callback_url:
        description: 回调API地址
        required: true
        type: string

permissions:
  contents: write

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout 目标仓库代码
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repo_owner }}/${{ inputs.repo_name }}
          token: ${{ secrets.PAT_TOKEN }}
          fetch-depth: 0 # 完整历史，用于 git log / blame 溯源

      - name: 2. Checkout Agent Forge 脚本
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.FORGE_REPO || 'wang361999/gitd' }}
          token: ${{ secrets.PAT_TOKEN }}
          path: ./forge-scripts
          sparse-checkout: |
            scripts

      - name: 3. 设置 Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: 4. 安装依赖
        run: |
          if [ -f package.json ]; then
            npm ci || npm install
          else
            echo "未找到 package.json，跳过依赖安装"
          fi

      - name: 5. 运行溯源扫描
        run: node forge-scripts/scripts/run-provenance.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 6. 运行安全检查
        run: node forge-scripts/scripts/run-security.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 7. 运行 Lore 决策提取
        run: node forge-scripts/scripts/run-lore.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 8. 聚合生成治理报告
        run: node forge-scripts/scripts/generate-report.js

      - name: 9. 上传治理报告到目标仓库 Releases
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          # 收集存在的治理报告文件
          FILES=""
          for f in .forge/governance-report.html .forge/provenance.json .forge/security-report.json .lore/decisions.jsonl; do
            [ -f "$f" ] && FILES="$FILES $f"
          done
          
          if [ -n "$FILES" ]; then
            gh release create "governance-${{ github.run_id }}" \
              --repo "${{ inputs.repo_owner }}/${{ inputs.repo_name }}" \
              --title "治理报告 ${{ inputs.repo_name }}" \
              --notes "自动生成的治理报告，包含来源溯源、安全检查与决策时间线。" \
              $FILES
            echo "治理报告已上传到目标仓库"
          else
            echo "未找到治理报告文件，跳过上传"
          fi

      - name: 10. 回调通知完成
        if: always()
        env:
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
        run: |
          STATUS="${{ job.status }}"
          echo "治理任务 ${{ inputs.task_id }} 状态: ${STATUS}"
          curl -s -X POST "${{ inputs.callback_url }}" \
            -H "Content-Type: application/json" \
            -H "X-Webhook-Secret: ${WEBHOOK_SECRET}" \
            -d "{
              \"taskId\": \"${{ inputs.task_id }}\",
              \"stage\": \"governance\",
              \"status\": \"${STATUS}\"
            }"
          echo "回调通知已发送"
