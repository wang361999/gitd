name: 打包分发

# 打包分发工作流：根据项目类型执行不同的打包策略，创建 GitHub Release 并生成安装说明
on:
  workflow_dispatch:
    inputs:
      project_type:
        description: 项目类型 (web/desktop/mobile)
        required: true
        type: string
        default: web
      repo_owner:
        description: 仓库 owner
        required: true
        type: string
      repo_name:
        description: 仓库名
        required: true
        type: string
      task_id:
        description: 任务ID
        required: true
        type: string
      callback_url:
        description: 回调API地址
        required: true
        type: string
      user_token:
        description: 用户的 GitHub OAuth token（用于操作用户仓库）
        required: true
        type: string

permissions:
  contents: write

jobs:
  package:
    # desktop 项目在 windows + macos 上分别打包；web/mobile 仅在 ubuntu 上运行
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.project_type == 'desktop' && '["windows-latest","macos-latest"]' || '["ubuntu-latest"]') }}
    steps:
      - name: 1. Checkout 目标仓库代码（使用用户 token）
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repo_owner }}/${{ inputs.repo_name }}
          token: ${{ inputs.user_token }}

      - name: 2. Checkout Agent Forge 脚本
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.FORGE_REPO || 'wang361999/gitd' }}
          token: ${{ secrets.PAT_TOKEN }}
          path: ./forge-scripts
          sparse-checkout: |
            scripts

      - name: 3. 设置 Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: 4. 安装依赖并构建项目
        run: |
          if [ -f package.json ]; then
            npm ci || npm install
            npm run build || echo "build 脚本不存在或失败，跳过"
          else
            echo "未找到 package.json，跳过构建"
          fi

      - name: 5. 执行打包策略
        id: package
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PLATFORM: ${{ matrix.os == 'windows-latest' && 'win' || matrix.os == 'macos-latest' && 'mac' || 'linux' }}
        run: |
          node forge-scripts/scripts/package-app.js \
            --project-type "${{ inputs.project_type }}" \
            --platform "${PLATFORM}"

      - name: 6. 创建 GitHub Release 到目标仓库并上传构建产物（使用用户 token）
        env:
          GH_TOKEN: ${{ inputs.user_token }}
        run: |
          # 收集存在的构建产物文件
          FILES=""
          for f in ./dist/* ./release-artifacts/*; do
            [ -f "$f" ] && FILES="$FILES $f"
          done
          
          # 创建 Release（优先使用 release-notes.md，不存在则用默认说明）
          if [ -f "./release-notes.md" ]; then
            gh release create "v${{ github.run_id }}" \
              --repo "${{ inputs.repo_owner }}/${{ inputs.repo_name }}" \
              --title "发布 ${{ inputs.repo_name }}" \
              --notes-file ./release-notes.md \
              $FILES
          else
            gh release create "v${{ github.run_id }}" \
              --repo "${{ inputs.repo_owner }}/${{ inputs.repo_name }}" \
              --title "发布 ${{ inputs.repo_name }}" \
              --notes "由 Agent Forge 自动生成" \
              $FILES
          fi
          echo "Release 已创建到目标仓库"

      - name: 7. 生成安装说明（GitHub Models）
        if: matrix.os == 'ubuntu-latest'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node forge-scripts/scripts/package-app.js --project-type "${{ inputs.project_type }}" --generate-guide

      - name: 8. 回调通知完成
        if: always()
        env:
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
        run: |
          STATUS="${{ job.status }}"
          VERSION_TAG="v${{ github.run_id }}"
          RELEASE_URL="https://github.com/${{ inputs.repo_owner }}/${{ inputs.repo_name }}/releases/tag/${VERSION_TAG}"
          DOWNLOAD_URL="https://github.com/${{ inputs.repo_owner }}/${{ inputs.repo_name }}/releases/latest"
          echo "打包任务 ${{ inputs.task_id }} 状态: ${STATUS}"
          curl -s -X POST "${{ inputs.callback_url }}" \
            -H "Content-Type: application/json" \
            -H "X-Webhook-Secret: ${WEBHOOK_SECRET}" \
            -d "{
              \"taskId\": \"${{ inputs.task_id }}\",
              \"stage\": \"package\",
              \"status\": \"${STATUS}\",
              \"result\": {
                \"versionTag\": \"${VERSION_TAG}\",
                \"releaseUrl\": \"${RELEASE_URL}\",
                \"downloadUrl\": \"${DOWNLOAD_URL}\",
                \"repoOwner\": \"${{ inputs.repo_owner }}\",
                \"repoName\": \"${{ inputs.repo_name }}\"
              }
            }"
          echo "回调通知已发送"
